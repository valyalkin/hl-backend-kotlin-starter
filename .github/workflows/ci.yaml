# Pull-request gate (Story 4.2, AD-20): the full build -- format check, Unit
# Tests, Integration Tests -- on a GitHub-hosted runner. Integration Tests get
# Postgres/Redis from Testcontainers inside the JVM (AD-21), so there is
# deliberately no `services:` block here. The image is not built on pull
# requests; publishing on `main` is Story 4.3's job.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Restores and saves Gradle's dependency cache and build cache between
      # runs. Writes are enabled on pull requests too (the action's default
      # only saves from the default branch), because this workflow does not
      # run on `main` until Story 4.3 and the cache would otherwise never be
      # populated.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build
        run: ./gradlew build --build-cache
