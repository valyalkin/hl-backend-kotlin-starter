# CI (Stories 4.2 and 4.3, AD-20). Every pull request, and every push to
# `main`, runs the full build -- format check, Unit Tests, Integration Tests --
# on a GitHub-hosted runner. Integration Tests get Postgres/Redis from
# Testcontainers inside the JVM (AD-21), so there is deliberately no
# `services:` block here. Only a push to `main`, after that build is green,
# builds and publishes the image.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale pull-request runs, but never cancel a mainline build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Restores and saves Gradle's dependency cache and build cache between
      # runs. Writes are enabled on pull requests too (the action's default
      # only saves from the default branch).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build
        run: ./gradlew build --build-cache

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Image name is lower-cased (registry requirement). Tags: git short SHA
      # plus `latest`; no semver in v1. Auth is the built-in GITHUB_TOKEN --
      # no stored registry secret.
      - name: Build and publish image
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          export IMAGE_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          export IMAGE_TAGS="ghcr.io/${repo}:${GITHUB_SHA::7},ghcr.io/${repo}:latest"
          ./gradlew bootBuildImage --imageName="ghcr.io/${repo}:${GITHUB_SHA::7}"
