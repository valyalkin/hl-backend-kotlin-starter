spring:
  datasource:
    # The only Spring configuration file with literal credentials. These are
    # throwaway values; the Compose stack's container-init settings in
    # docker-compose.yaml (POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD all
    # "hl_service", port 5432) are the matching peer and are not packaged in the
    # image.
    # `./gradlew bootRun` activates this profile by default (see the `bootRun`
    # task in build.gradle.kts, Story 1.7); override with SPRING_PROFILES_ACTIVE
    # to run against something else.
    url: jdbc:postgresql://localhost:5432/hl_service
    username: hl_service
    password: hl_service
springdoc:
  swagger-ui:
    # Overrides the default-profile application.yaml (false) so local
    # exploration via /swagger-ui/index.html works out of the box (Story 2.10).
    enabled: true
logging:
  structured:
    format:
      # Overrides the base application.yaml's `ecs` back to Boot's default
      # human-readable console pattern for local development (Story 3.3).
      # An explicit empty value, not an omitted key, is required: this file
      # layers on top of (does not replace) the base application.yaml, and
      # Boot only falls back to the plain PatternLayoutEncoder when the
      # resolved `logging.structured.format.console` property is blank
      # (confirmed by inspecting Boot 4.1.1's DefaultLogbackConfiguration,
      # which feeds the merged property straight into
      # `StringUtils.hasLength(...)`) -- an unset key here would leave the
      # base profile's `ecs` value in effect.
      console: ''
