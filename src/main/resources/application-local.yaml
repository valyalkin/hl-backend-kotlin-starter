spring:
  datasource:
    # The only Spring configuration file with literal credentials. These are
    # throwaway values; the Compose stack's container-init settings in
    # docker-compose.yaml (POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD all
    # "hl_service", port 5432) are the matching peer and are not packaged in the
    # image.
    # `./gradlew bootRun` activates this profile by default (see the `bootRun`
    # task in build.gradle.kts, Story 1.7); override with SPRING_PROFILES_ACTIVE
    # to run against something else.
    url: jdbc:postgresql://localhost:5432/hl_service
    username: hl_service
    password: hl_service
