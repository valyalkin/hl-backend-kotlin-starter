spring:
  datasource:
    # No default: an unset SPRING_DATASOURCE_* env var must fail startup with a
    # clear "Could not resolve placeholder" error rather than degrade silently
    # (AD-15, Story AC-3). Literal credentials live only in application-local.yaml.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # Flyway is the only schema authority (AD-14); Hibernate only validates the
      # mapping against the Flyway-managed schema and never alters it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Checksum validation on (AD-14). Auto-repair is intentionally NOT wired:
    # no spring.flyway.* repair property is set and no repair() call exists, so a
    # missing or checksum-mismatched migration fails startup loudly.
    validate-on-migrate: true
  data:
    web:
      pageable:
        # Documents the collection GET's default page size as a discoverable
        # config value rather than relying on Spring Data's implicit default.
        default-page-size: 20
    redis:
      # Defaults equal the Compose stack's no-auth localhost:6379 (Story 1.4); no
      # fail-loud requirement here (unlike the datasource above) since a working
      # default already matches local dev.
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  cache:
    # Framework-managed cache-aside for WidgetService.findById (Story 2.7): a
    # RedisCacheManager is autoconfigured from these properties, no custom
    # CacheManager bean. TTL applies to every cache, dynamically created
    # caches included.
    type: redis
    # Pre-declares every @Cacheable cache name (just "widgets" today) as an
    # initial cache on the autoconfigured RedisCacheManager. Micrometer's
    # cache-metrics binder only sees caches that exist at CacheManager
    # creation time (Story 3.1); without this, a Redis cache created lazily
    # on first access is invisible to /actuator/prometheus. A future
    # resource's own @Cacheable cache name must be added here too for its
    # cache metrics to appear.
    cache-names: widgets
    redis:
      time-to-live: 10m
logging:
  structured:
    format:
      # Spring Boot's built-in structured console logging (Story 3.3, AD-17):
      # every stdout line becomes single-line ECS (Elastic Common Schema)
      # JSON -- the vendor-neutral choice with no downstream log sink
      # specified for this starter -- carrying at minimum @timestamp,
      # log.level, log.logger, and message. No logging encoder dependency,
      # no owned logback.xml/logback-spring.xml: this one property is the
      # entire change. Story 3.2's Slf4JEventListener already writes
      # MDC["traceId"]/MDC["spanId"] per active span; ECS's structured
      # formatter spreads every MDC entry as its own top-level JSON field
      # (confirmed by inspecting Boot 4.1.1's
      # ElasticCommonSchemaStructuredLogFormatter), so a log line emitted
      # while a request's span is active also carries top-level `traceId`
      # and `spanId` fields with zero extra wiring. Overridden back to
      # human-readable console output under application-local.yaml.
      console: ecs
management:
  tracing:
    sampling:
      # Every span is sampled by default (Story 3.2); overridable per
      # environment via MANAGEMENT_TRACING_SAMPLING_PROBABILITY. Harmless
      # while no OTLP endpoint is configured below -- sampled spans with
      # nowhere to export to are simply dropped, not sent anywhere.
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  # management.opentelemetry.tracing.export.otlp.endpoint is deliberately
  # unset here: Boot's OTLP tracing auto-configuration only creates an
  # OtlpHttpSpanExporter bean once this property has a value (Story 3.2), so
  # omitting it keeps trace export a genuine no-op -- no exporter bean, no
  # connection attempts, no export/connection-refused log lines -- on every
  # profile that doesn't set MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT.
  endpoint:
    health:
      group:
        readiness:
          # Boot's own readinessState plus the db and redis contributors: readiness
          # is UP only once Postgres and Redis are both reachable (AD-13, AD-17).
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        # Widens web exposure from the default (health only) to exactly these
        # three so a Prometheus server can scrape JVM/HTTP/datasource/cache
        # metrics with zero application code (Story 3.1, AD-17). Same main
        # port -- no management.server.port is introduced.
        include: health,info,prometheus
springdoc:
  swagger-ui:
    # Off by default on every profile; /v3/api-docs itself stays served on
    # every profile via springdoc's own auto-configuration regardless of this
    # flag (Story 2.10). Re-enabled only under application-local.yaml.
    enabled: false
