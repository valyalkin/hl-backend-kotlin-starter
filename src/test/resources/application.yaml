spring:
  # This file fully shadows the main application.yaml during tests, so it
  # needs to restate every key the Testcontainers-backed connection relies
  # on. Story 2.2's IntegrationTestBase supplies a real Postgres/Redis via
  # @ServiceConnection, so JPA/Datasource/Flyway auto-configuration are no
  # longer excluded here -- mirrors src/main/resources/application.yaml.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    validate-on-migrate: true
management:
  endpoint:
    health:
      group:
        readiness:
          # Boot's own readinessState plus the db and redis contributors: readiness
          # is UP only once Postgres and Redis are both reachable (AD-13, AD-17).
          include: readinessState,db,redis
