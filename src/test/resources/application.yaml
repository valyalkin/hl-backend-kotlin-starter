spring:
  # This file fully shadows the main application.yaml during tests, so it
  # needs to restate every key the Testcontainers-backed connection relies
  # on. Story 2.2's IntegrationTestBase supplies a real Postgres/Redis via
  # @ServiceConnection, so JPA/Datasource/Flyway auto-configuration are no
  # longer excluded here -- mirrors src/main/resources/application.yaml.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    validate-on-migrate: true
  cache:
    type: redis
    # Mirrors src/main/resources/application.yaml (Story 3.1): pre-declares
    # the "widgets" cache so its metrics are bound at CacheManager creation
    # time, before PrometheusMetricsIT's GET /actuator/prometheus.
    cache-names: widgets
    redis:
      time-to-live: 10m
management:
  tracing:
    sampling:
      # Mirrors src/main/resources/application.yaml (Story 3.2).
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  # management.opentelemetry.tracing.export.otlp.endpoint stays unset here
  # too, mirroring src/main/resources/application.yaml (Story 3.2); the
  # default-profile Integration Tests must see the same no-op export as
  # production. OtlpTracingIT sets it per-test via a dynamic property instead.
  endpoint:
    health:
      group:
        readiness:
          # Boot's own readinessState plus the db and redis contributors: readiness
          # is UP only once Postgres and Redis are both reachable (AD-13, AD-17).
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        # Mirrors src/main/resources/application.yaml (Story 3.1) so the
        # default-profile ITs see the same widened exposure as production.
        include: health,info,prometheus
springdoc:
  swagger-ui:
    # Mirrors src/main/resources/application.yaml so the default-profile IT
    # (OpenApiIT) sees the same disabled state as production (Story 2.10).
    enabled: false
